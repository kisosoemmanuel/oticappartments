<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTIC Admin Portal</title>
    <style>
      :root {
        --bg: #13b8b5;
        --panel: #ffffff;
        --line: #bdebea;
        --text: #123638;
        --muted: #4f7576;
        --primary: #11a7a7;
        --primary-strong: #0b7f7f;
        --success: #0d7b5d;
        --danger: #b42318;
        --shadow: 0 22px 54px rgba(5, 71, 70, 0.18);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #15c8c4 0%, #0fa8a5 100%);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .login-card {
        width: min(100%, 430px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 30px 28px 26px;
      }
      .brand {
        display: flex;
        align-items: center;
        margin-bottom: 18px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        border: 0;
      }
      .brand img {
        display: block;
        width: 190px;
        max-width: 100%;
        height: auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 2.4vw, 2.5rem);
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 14px 0 8px;
        color: var(--muted);
        font-weight: 700;
        font-size: 0.82rem;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      input:focus {
        outline: 2px solid rgba(17, 167, 167, 0.18);
        border-color: var(--primary);
      }
      button {
        width: 100%;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--primary-strong); }
      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--danger);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand" aria-label="OTIC logo">
        <img src="/Otic%20Apartments%20Brand.png" alt="Otic Apartments logo" />
      </div>
      <h1>Admin sign in</h1>
      <p>Use your secure OTIC administrator account to access the property management system.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <div id="status" class="status" aria-live="polite"></div>
        <button type="submit">Sign in</button>
      </form>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const statusEl = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusEl.textContent = 'Signing in...';

        const response = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim(),
          }),
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          statusEl.textContent = payload.error || 'Login failed.';
          return;
        }

        window.location.href = '/secure-admin';
      });
    </script>
  </body>
</html>
