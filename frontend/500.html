<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System error</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --line: #dfe7f3;
        --text: #172c3f;
        --muted: #5d7087;
        --primary: #1f4d7a;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f9fc 0%, #eef4f9 100%);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
      }
      .card {
        width: min(100%, 520px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 18px 42px rgba(19, 38, 59, 0.08);
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        color: var(--danger);
        margin: 0 0 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">500</div>
      <h1>System error</h1>
      <p>Something went wrong on the OTIC admin server. Please try again or return to the login screen.</p>
      <a href="/secure-admin/login">Back to login</a>
    </main>
  </body>
</html>
